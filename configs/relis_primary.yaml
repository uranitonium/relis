data:
  data_dir: paper_experiments/experiments/truncated_retraining/data/train
  file_glob: '*_l2.json'
  max_files: 0
  max_len: 0
  shuffle: true
  synthetic: false
  synthetic_T: 200
  synthetic_m: 26
  synthetic_num: 200
eval:
